<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Lobare</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            width: 260px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        #status {
            margin-bottom: 10px;
            font-size: 12px;
            color: #555;
        }

        #list {
            width: 100%;
            height: 220px;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 13px;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            background: #0d6efd;
            color: white;
        }

        button:hover {
            background: #0b5ed7;
        }

    </style>
</head>
<body>

<h1>Lobare</h1>

<div id="status">Laddar...</div>

<textarea id="list" readonly></textarea>

<button id="copy">Kopiera lista</button>

<script src="popup.js"></script>
</body>
</html>
