<!DOCTYPE html>
<html lang="sv">

<head>

    <meta charset="UTF-8">

    <title>Godkänn kontering</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f5f7;

            color: #222;
        }


        h1 {

            margin-top: 0;

            font-size: 22px;
        }


        #status {

            margin-bottom: 15px;

            padding: 10px;

            background: #fff;

            border-radius: 5px;

            border: 1px solid #ddd;
        }


        #sheet-wrapper {

            background: white;

            border:
                1px solid #ddd;

            border-radius: 6px;

            overflow: auto;

            max-height: 65vh;

            margin-bottom: 15px;
        }


        #sheet-table {

            border-collapse: collapse;

            width: 100%;

            font-size: 13px;
        }


        #sheet-table th {

            position: sticky;

            top: 0;

            background: #f1f3f4;

            border: 1px solid #ddd;

            padding: 6px 8px;

            text-align: left;

            white-space: nowrap;

            z-index: 1;
        }


        #sheet-table td {

            border: 1px solid #ddd;

            padding: 0;
        }


        #sheet-table td.row-number {

            padding: 6px 8px;

            color: #888;

            background: #f8f9fa;

            text-align: center;
        }


        #sheet-table tbody tr:nth-child(even) td {

            background: #fafbfc;
        }


        #sheet-table input {

            width: 100%;

            height: 100%;

            box-sizing: border-box;

            padding: 6px 8px;

            border: none;

            font-size: 13px;

            background: transparent;
        }


        #sheet-table input:focus {

            outline: 2px solid #0d6efd;

            outline-offset: -2px;

            background: #eaf2ff;
        }


        .actions {

            position: sticky;

            bottom: 0;

            padding-top: 15px;

            padding-bottom: 5px;

            background:
                linear-gradient(
                    transparent,
                    #f4f5f7 20%
                );
        }


        button {

            padding:
                10px 18px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;
        }


        #sendSheets {

            background: #0d6efd;

            color: white;
        }


        #sendSheets:hover {

            background: #0b5ed7;
        }


        #cancel {

            background: #6c757d;

            color: white;

            margin-left: 8px;
        }


        button:disabled {

            opacity: 0.6;

            cursor: default;
        }


        .error {

            color: #b02a37;

            background: #f8d7da;

            border:
                1px solid #f5c2c7;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 15px;
        }


        .success {

            color: #0f5132;

            background: #d1e7dd;

            border:
                1px solid #badbcc;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 15px;
        }

    </style>

</head>


<body>

    <h1>
        Skicka till Google Sheets
    </h1>


    <div id="status">
        Laddar data...
    </div>


    <div id="error"></div>


    <div id="sheet-wrapper">
        <table id="sheet-table"></table>
    </div>


    <div class="actions">

        <button
            id="sendSheets"
            disabled
        >
            Skicka till Google Sheets
        </button>


        <button id="cancel">
            Avbryt
        </button>

    </div>


    <script src="review.js"></script>

</body>

</html>
